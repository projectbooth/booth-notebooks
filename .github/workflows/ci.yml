name: CI

# Layers 1-2 (contracts/testing-strategy.md, ADR 0024): unit + contract tests on every push and PR.
# Branch protection on main requires every job here to pass before merge. No coverage threshold.
#
# tests/hub starts a REAL JupyterHub process with this module's configuration (only the spawner and
# proxy swapped out) and drives it over HTTP; it needs no cluster, so it runs here, not in layer 3.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: azure/setup-helm@v4 # tests/contract renders the chart with `helm template`
      - name: Install
        run: pip install -e ".[dev]" -e client
      - name: Lint
        run: ruff check src tests client
      - name: Unit, client, live-hub and contract tests
        env:
          # A missing helm must FAIL the build, never silently skip the contract tests green.
          BOOTH_TEST_REQUIRE_EMULATORS: "1"
        run: pytest tests/unit tests/client tests/hub tests/contract

  images:
    # Catches a broken Dockerfile on the PR that breaks it, and smoke-checks what each image must contain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t booth-notebooks-hub:ci -f images/hub/Dockerfile .
          docker build -t booth-notebooks-singleuser:ci -f images/singleuser/Dockerfile .
      - name: The hub image has the hub package, KubeSpawner, the culler and a Postgres driver
        run: docker run --rm booth-notebooks-hub:ci python -c "import booth_notebooks, kubespawner, jupyterhub_idle_culler, psycopg2"
      - name: The default kernel has the documented environment and the booth client
        run: docker run --rm booth-notebooks-singleuser:ci python -c "import booth, pandas, pyarrow, duckdb, matplotlib; import jupyterhub; assert jupyterhub.__version__.startswith('5.')"
      - name: The notebook server honours the shell's framing origin
        run: |
          docker run --rm -e BOOTH_FRAME_ANCESTORS=https://booth.example.com booth-notebooks-singleuser:ci python -c "
          from jupyter_server.serverapp import ServerApp
          from traitlets.config.loader import PyFileConfigLoader
          c = PyFileConfigLoader('jupyter_server_config.py', path='/etc/jupyter').load_config()
          # a real dict, not a LazyConfigValue: jupyterhub-singleuser crashes on the latter (found on kind)
          assert isinstance(c.ServerApp.get('tornado_settings'), dict)
          assert ServerApp(config=c).tornado_settings['headers']['Content-Security-Policy'] == 'frame-ancestors https://booth.example.com'"
