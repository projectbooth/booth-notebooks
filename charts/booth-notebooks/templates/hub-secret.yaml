{{- if not .Values.hub.secret.name }}
{{- /*
The hub's own secrets, generated once and kept (lookup + resource-policy: keep), because rotating any
of them on every `helm upgrade` would break things: the crypt key encrypts stored auth_state (each
user's platform identity), the cookie secret signs every open session, and the proxy token is shared
with the proxy Deployment. None of these ever reaches a notebook pod (spawner.check_pod enforces it).
*/ -}}
{{- $name := include "booth-notebooks.hubSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "booth-notebooks.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  crypt-key: {{ index $existing.data "crypt-key" }}
  cookie-secret: {{ index $existing.data "cookie-secret" }}
  proxy-token: {{ index $existing.data "proxy-token" }}
  {{- else }}
  crypt-key: {{ randAlphaNum 32 | sha256sum | trunc 64 | b64enc }}
  cookie-secret: {{ randAlphaNum 32 | sha256sum | trunc 64 | b64enc }}
  proxy-token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
