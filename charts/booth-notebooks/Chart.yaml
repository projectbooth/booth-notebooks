apiVersion: v2
name: booth-notebooks
description: >
  Project Booth's notebooks module: JupyterHub with KubeSpawner, one isolated notebook pod per person
  per workspace (ADR 0011), embedded in the shell via iframe-proxy (ADR 0005).
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/projectbooth/booth-notebooks

# ADR 0113 / contracts/module-manifest.md "Chart annotation: identity keys": tells booth-core's install
# API which of this chart's values.yaml paths carry the platform's shared identity settings, so a module
# installed through the install API (the Module Store's Install button included) is configured without
# hand-typed values. Core fills a mapped path only when the request doesn't already set it. No
# workloadIssuerUrl: the hub mints workload tokens but never verifies them. iframeIssuerUrl is
# identity.issuerUrl, whose default already equals core's own iframe-identity issuer. coreUrl (amendment 1)
# is core.url, which the hub reads as BOOTH_CORE_URL; its default stays the fallback for CLI installs.
annotations:
  booth.projectbooth.io/identity-keys: |
    {"issuerUrl":"oidc.issuerUrl","clientId":"oidc.clientId","jwksUrl":"oidc.jwksUrl","groupsClaim":"oidc.groupsClaim","iframeIssuerUrl":"identity.issuerUrl","coreUrl":"core.url"}
